<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiferAl</title>
  <meta name="description" content="LiferAl 的博客、笔记和实验记录。">
  <link rel="icon" href="assets/avatar.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/vendor/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script>if (!location.hash || location.hash === "#" || location.hash === "#/") document.body.classList.add("is-home");</script>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <span class="avatar-frame"><img src="assets/avatar.png" alt=""></span>
        LiferAl
      </a>
      <form class="search" role="search">
        <label class="sr-only" for="q">搜索文章</label>
        <input id="q" type="search" placeholder="搜索博客或笔记" autocomplete="off" enterkeyhint="search">
      </form>
      <nav class="nav" aria-label="页面">
        <a href="#/" data-nav="home">首页</a>
        <a href="#/paper" data-nav="paper">paper</a>
        <a href="#/note" data-nav="note">note</a>
        <a href="#/tools" data-nav="tools">工具链接</a>
      </nav>
    </div>
  </header>
  <div class="hero">
    <p class="hero-line" aria-label="Life is a soup, and I'm a fork">
      <span class="hero-typed">
        <span class="hero-typed-text"></span><span class="typed-cursor" aria-hidden="true">|</span>
      </span>
    </p>
  </div>
  <div class="shell">
    <main id="main">
      <p class="empty">需要开启 JavaScript 才能显示文章。</p>
    </main>
    <aside id="side" class="side"></aside>
  </div>
  <script src="js/vendor/marked.min.js"></script>
  <script src="js/vendor/highlight.min.js"></script>
  <script src="js/vendor/katex.min.js"></script>
  <script src="js/site.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
